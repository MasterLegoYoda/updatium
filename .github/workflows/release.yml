name: Build and release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          archive="updatium-linux-${ARCH}.tar.gz"
          tar -czf "$archive" -C target/release updatium
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            updatium-linux-${{ matrix.arch }}.tar.gz
            updatium-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="main-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" updatium-linux-*.tar.gz updatium-linux-*.tar.gz.sha256 --clobber
          else
            gh release create "$tag" updatium-linux-*.tar.gz updatium-linux-*.tar.gz.sha256 \
              --target "$GITHUB_SHA" \
              --title "main ${GITHUB_SHA}" \
              --notes "Automated build for commit ${GITHUB_SHA}."
          fi
