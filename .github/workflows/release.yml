name: Build and release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check release binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/${TARGET}/release/updatium"
          if readelf -l "$binary" | grep -q INTERP || readelf -d "$binary" | grep -q NEEDED; then
            echo "Release binary unexpectedly requires a shared library or interpreter" >&2
            exit 1
          fi
          "$binary" --version

      - name: Package binary
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          archive="updatium-linux-${ARCH}.tar.gz"
          tar -czf "$archive" -C "target/${TARGET}/release" updatium -C "$GITHUB_WORKSPACE" LICENSE
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            updatium-linux-${{ matrix.arch }}.tar.gz
            updatium-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" updatium-linux-*.tar.gz updatium-linux-*.tar.gz.sha256 --clobber
          else
            gh release create "$tag" updatium-linux-*.tar.gz updatium-linux-*.tar.gz.sha256 \
              --target "$GITHUB_SHA" \
              --title "${GITHUB_REF_NAME} ${GITHUB_SHA}" \
              --notes "Automated build for commit ${GITHUB_SHA}."
          fi
